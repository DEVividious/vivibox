[project]
name = "vivibox"
# The version comes from git: a tag vX.Y.Z, or X.Y.(Z+1).devN+g<commit> past it (ADR: CHANGELOG.md).
dynamic = ["version"]
description = "Coding agents in a box that keeps them off your machine, in both directions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Jaworski" }]
keywords = ["ai", "coding-agent", "sandbox", "docker", "sysbox", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    # The details panel's safety rests on how this Textual builds a link, a table's cell and a
    # tooltip from markdown (vivibox/markdown.py): the next major is taken up by hand, with its
    # tests run.
    "textual>=8.2.8,<9",
    # Textual's parser, used directly there (the panel's own rules).
    "markdown-it-py>=4.2.0,<5",
]

[project.urls]
Homepage = "https://github.com/DEVividious/vivibox"
Changelog = "https://github.com/DEVividious/vivibox/blob/main/CHANGELOG.md"
Issues = "https://github.com/DEVividious/vivibox/issues"

[project.scripts]
vivibox = "vivibox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "shellcheck-py>=0.10"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["vivibox"]

[tool.ruff]
line-length = 110
target-version = "py312"
# The root helper is Python without the extension (host/setup.sh installs it as a command).
extend-include = ["host/vivibox-host"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that build images or start containers: uv run pytest -m docker
markers = [
    "docker: needs a Docker daemon and network access",
    "real_start: uses the real actions.start instead of the stand-in from conftest",
    "real_hostd: starts the DNS forwarder's process (vivibox hostd), which conftest otherwise stands in for",
    "real_notify: uses the real supervisor.notify and ntfy.post instead of the recorders from conftest",
    "model: runs an agent on a real model, for money; only when asked (tests/behavioural)",
]
addopts = "-m 'not docker and not model'"
