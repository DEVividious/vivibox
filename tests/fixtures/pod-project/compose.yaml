services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: podcheck
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
