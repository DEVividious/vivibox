name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The token reads the repository and nothing more, unless a job says otherwise. Actions are pinned
# to a commit, their version beside it; Dependabot (.github/dependabot.yml) proposes new ones.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -n auto
      - run: uv build
      - run: uv run vivibox --version

  changelog:
    # A change under vivibox/ has its line in CHANGELOG.md (AGENTS.md); tests/test_structure.py
    # checks the same on a branch with main at hand, which a pull request's checkout lacks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if grep -q '^vivibox/' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error::a change under vivibox/ needs a line in CHANGELOG.md (see AGENTS.md)"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request gitleaks reads its commits and comments on a leak it finds.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # publish:
