[project]
name = "vivibox"
version = "0.1.0"
description = "Orchestrator for AI agent tasks in isolated pods"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Jaworski" }]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
vivibox = "vivibox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "shellcheck-py>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vivibox"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that build images or start containers: uv run pytest -m docker
markers = [
    "docker: needs a Docker daemon and network access",
    "real_start: uses the real actions.start instead of the stand-in from conftest",
    "model: runs an agent on a real model, for money; only when asked (tests/behavioural)",
]
addopts = "-m 'not docker and not model'"
