# ~/.config/vivibox/config.toml. vivibox writes it on its first run, from your answers; edit it freely.
# Keep endpoints, model names and anything employer-specific in this file, never in the repo.

# Absolute path, outside $HOME, mounted nosuid,nodev (host/setup.sh prepares it).
tasks_dir = "/srv/vivibox"

# How a task is shared between the planner (P), the writer (W) and the reviewer (R), and where
# the verification (Gate) runs; roles joined with + are one agent on the first one's model.
#   single_agent           P+W+R → Gate          small, routine, cheap tasks
#   planner_executor       P → W+R → Gate        a good plan matters, the implementation is routine
#   planner_writer_reviewer  P → W → Gate → R ⇄ W  an independent review at every round (the default)
#   supervisor_worker      P → W → Gate → (P+R) ⇄ W  hard changes under a strong model's supervision
# The same choice is under k, and per task under n.
agent_orchestration_mode = "planner_writer_reviewer"

[limits]
# Fix turns the writer gets on its own, from the verification or from the review, before the work
# comes to you; your reply gives it as many again. The first implementation is none of them.
max_rounds = 3
# Seconds one verification command may take. Past it the command is stopped and the task waits
# for you as on any failure outside the code (a build waiting for Docker, a registry that hangs).
verify_timeout = 1800
# A project verified by its modules ({modules} in its verify command) builds only the ones a task's
# plan names; true builds the whole project once more before the work comes to you.
whole_build_before_review = false
# Dollars a task may cost, planning and implementation together, before you are told, and before
# it stops for you (it waits with the figures on its row; raise the limit and start it again).
# Checked before each turn, so a turn may run past the limit by its own cost. Left out: no limit.
# cost_warning = 1.0
# cost_limit = 2.0
# One entry per role; planner and writer are both required.
# harness: "opencode" or "claude-code", which run on an API key, or "manual" for the planner.
# Planning is where a wrong decision costs the most and the fewest tokens are spent, so it is worth
# a stronger model than the one that writes the code.
#
# manual: you plan in a chat of your own -- claude.ai, Gemini, a CLI such as claude or gemini --
# on whatever plan you have there. vivibox gives you the prompt and takes back the plan; it never
# touches your login, so a subscription stays your own use of it. Everything after the plan runs
# on its own. For planning without you, give the planner an API key instead:
#   harness = "claude-code"
#   model = "claude-opus-5"          # vivibox auth set anthropic
[roles.planner]
harness = "manual"
model = "Opus on claude.ai"          # a label for your task list; vivibox runs nothing here

[roles.writer]
harness = "opencode"
model = ""                           # picked in the view the first time you create a task

# The reviewer of planner_writer_reviewer reads the work after the verification passes, in a
# container of its own, and its blocking notes go back to the writer. Without this entry it runs
# on the writer's model; another family of models than the writer's is the point of naming one.
# [roles.reviewer]
# harness = "opencode"
# model = "anthropic/claude-sonnet-5"

[notifications]
# Desktop notifications (notify-send) when a task waits for you: off until you turn them on,
# here or under k. Messages always appear in the task's supervisor window, and the list rings the
# terminal's bell when a task starts to wait.
desktop = false
# The same messages on your phone, through ntfy: the name of a topic, which the app on your phone
# subscribes to. Pick one nobody guesses: anyone who knows it reads the messages, which is why
# they say what happened, never what the agent or the build said. A token, when the topic needs
# one: vivibox auth set ntfy
# ntfy = "<topic>"
# ntfy_server = "https://ntfy.sh"     # or a server of your own
# What goes there: "decisions", a word at the start and then what the desktop gets, or "all",
# every stage of a task too.
# ntfy_events = "decisions"

[review]
# Command that opens a folder in your editor, with {path} where the folder goes ("code -n {path}");
# without {path} it is added at the end. Left out, vivibox asks once, listing the editors it finds,
# and writes your choice here. A project file can set its own 'ide' for that project.
# ide = "idea {path}"

[network]
# Addresses task pods are given, one /28 per task, so each task has its own address and its ports
# collide with no other task. The default is TEST-NET-2, which RFC 5737 reserves for documentation:
# no real network and no product may use it, so nothing on your machine collides with it. Change it
# only if something here already routes this range; host/setup.sh --check says so if it does.
# pool = "198.51.100.0/24"
# Docker Hub's images kept once on this machine: a pull-through cache in a container of its own,
# vivibox-mirror, that every pod's Docker pulls through, so the second task that needs mysql does not
# download it again. Each pod keeps its own daemon and images; the cache listens only where the pods
# reach this machine, and forgets a layer nobody pulled for two weeks. Other registries (quay.io,
# ghcr.io) are pulled as before. vivibox mirror says what it holds.
# hub_mirror = true
# hub_mirror_port = 5055
